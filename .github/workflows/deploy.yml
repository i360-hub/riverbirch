# Push-to-deploy: build the Astro site and deploy to the existing Cloudflare
# Pages project, then smoke-check the launch checklist. Note the prod domain's
# edge cache may serve stale HTML briefly after a deploy; header checks are
# unaffected, and the canonical check runs against the fresh pages.dev copy.
# Requires repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name river-birch

      - name: Smoke-check launch checklist
        run: |
          sleep 10

          echo "1/5 staging must serve 200 with noindex..."
          curl -s -D - -o /dev/null "https://river-birch.pages.dev/" | tee /tmp/h
          grep -i "x-robots-tag: noindex" /tmp/h

          echo "2/5 fresh build must carry the prod canonical (checked on pages.dev)..."
          curl -sf "https://river-birch.pages.dev/" | grep -q 'rel="canonical" href="https://riverbirchtreeservice.com/"'

          echo "3/5 production must serve 200..."
          curl -sf -o /dev/null "https://riverbirchtreeservice.com/?cb=$(date +%s)"

          echo "4/5 production must NOT be noindexed..."
          ! curl -s -D - -o /dev/null "https://riverbirchtreeservice.com/?cb=$(date +%s)" | grep -qi "x-robots-tag"

          echo "5/5 www must 301 to the apex, path preserved..."
          curl -s -D - -o /dev/null "https://www.riverbirchtreeservice.com/tree-removal?cb=$(date +%s)" | tee /tmp/w
          grep -qi "^HTTP/.* 301" /tmp/w
          grep -qi "^location: https://riverbirchtreeservice.com/tree-removal" /tmp/w

          echo "All checks passed."

      # Ping IndexNow with the just-built sitemap URLs so Bing/Yandex/etc. recrawl
      # promptly. Key is public (served at /<key>.txt), so no secret needed. This
      # is a best-effort notification — a failure here must not fail the deploy.
      - name: Notify IndexNow
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.error
          key  = "19c835a4b30ae415f0c9434ce2a635ad"
          host = "riverbirchtreeservice.com"
          urls = re.findall(r"<loc>(.*?)</loc>", open("dist/sitemap-0.xml", encoding="utf-8").read())
          if not urls:
              raise SystemExit("No URLs found in dist/sitemap-0.xml")
          body = {
              "host": host,
              "key": key,
              "keyLocation": f"https://{host}/{key}.txt",
              "urlList": urls,
          }
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(body).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          try:
              r = urllib.request.urlopen(req, timeout=30)
              print(f"IndexNow accepted (HTTP {r.status}) — submitted {len(urls)} URLs")
          except urllib.error.HTTPError as e:
              print(f"IndexNow HTTP {e.code}: {e.read().decode(errors='replace')}")
              raise
          PY
